services:
  - type: web
    name: jobhuntgenie
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobhuntgenie-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: MIN_SALARY_USD
        value: 150000
      - key: MAX_SALARY_USD
        value: 300000
      - key: TARGET_JOBS
        value: "SWE-2,Senior Backend Engineer,Platform Engineer"
      - key: SCRAPE_SCHEDULE
        value: "0 9 * * *"
      - key: SCRAPE_DICE
        value: "1"
      - key: SCRAPE_INDEED
        value: "1"
      - key: SCRAPE_LINKEDIN
        value: "0"

databases:
  - name: jobhuntgenie-db
    databaseName: jobhuntgenie
    plan: free
