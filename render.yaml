services:
  - type: web
    name: jobhuntgenie
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobhuntgenie-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: MIN_SALARY_USD
        value: 150000
      - key: MAX_SALARY_USD
        value: 300000
      - key: TARGET_JOBS
        value: "Software Engineer 2,Senior Software Engineer,Senior Backend Engineer,Full Stack Engineer,Node.js Engineer,React Engineer,Ruby on Rails Engineer,Frontend Engineer,TypeScript Engineer,Backend Developer,Frontend Developer,Software Engineer"
      - key: SCRAPE_SCHEDULE
        value: "0 */2 * * *"
      - key: SCRAPE_DICE
        value: "1"
      - key: SCRAPE_INDEED
        value: "1"
      - key: SCRAPE_GLASSDOOR
        value: "1"
      - key: SCRAPE_WWR
        value: "1"
      - key: SCRAPE_REMOTECO
        value: "1"
      - key: SCRAPE_LINKEDIN
        value: "0"

databases:
  - name: jobhuntgenie-db
    databaseName: jobhuntgenie
    plan: free
